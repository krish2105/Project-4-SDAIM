name: MLOps pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/requirements.txt
      - name: Install Dependencies
        run: pip install -r mlops/requirements.txt
      - name: Validate Hugging Face credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              print(
                  "::error title=Missing HF_TOKEN::Add a repository Actions secret "
                  "named HF_TOKEN containing a Hugging Face token with write access."
              )
              sys.exit(1)

          try:
              account = HfApi(token=token).whoami()
          except Exception:
              print(
                  "::error title=Invalid HF_TOKEN::The HF_TOKEN secret is invalid, "
                  "expired, or does not have access to the Hugging Face account."
              )
              sys.exit(1)

          username = account.get("name") or account.get("fullname") or "unknown"
          print(f"Authenticated to Hugging Face as {username}.")
          PY
      - name: Upload Dataset to Hugging Face Hub
        run: python mlops/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/requirements.txt
      - name: Install Dependencies
        run: pip install -r mlops/requirements.txt
      - name: Run Data Preparation
        run: python mlops/model_building/prep.py

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/requirements.txt
      - name: Install Dependencies
        run: pip install -r mlops/requirements.txt
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &
          sleep 5
      - name: Model Building
        run: python mlops/model_building/train.py

  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training, data-prep, register-dataset]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/requirements.txt
      - name: Install Dependencies
        run: pip install -r mlops/requirements.txt
      - name: Push files to Frontend Hugging Face Space
        run: python mlops/hosting/hosting.py
